name: test

on:
  push:
  pull_request:
  merge_group:

jobs:
  test-linux:
    env:
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      - name: Install tools required
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - name: Rust fmt check
        uses: actions-rust-lang/rustfmt@v1
      - name: Run tests
        run: |
          if modinfo mlx5_ib >/dev/null 2>&1 && lsmod | grep -q '^mlx5_ib'; then
            sudo rmmod mlx5_ib
          fi
          cd ${{ github.workspace }}
          sudo apt install libibverbs1 librdmacm1 ibverbs-utils
          sudo rm /etc/libibverbs.d/mana.driver
          sudo ibv_devinfo || true
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Get coverage info
        run: |
          just test-basic-with-cov
          just generate-cov
      - name: Upload coverage information
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          file: lcov.info

  test-rxe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      - name: Install tools required
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - name: Load rxe kmod
        run: |
          uname -a
          sudo modprobe rdma_rxe
          ip add
          # the NIC is not always eth0 (e.g. enp39s0 on some runners): use the one
          # carrying the default route
          netdev=$(ip -o route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "dev") { print $(i + 1); exit }}')
          sudo rdma link add rxe0 type rxe netdev "$netdev"
          rdma link show
      - name: Build rdma-core
        run: |
          sudo apt update
          sudo apt install -y make pkg-config cmake libnl-3-dev libnl-route-3-dev libnl-genl-3-dev
          git clone https://github.com/linux-rdma/rdma-core.git
          ./rdma-core/build.sh
      - name: Test with RXE
        run: |
          rm ./rdma-core/build/etc/libibverbs.d/mana.driver
          export LD_LIBRARY_PATH=./rdma-core/build/lib
          # the runner's NIC (mlx5 or MANA) has no RoCE, and would claim its address in
          # RDMA CM; unload it here, as its VF may attach after the rxe setup
          for m in mlx5_ib mana_ib; do
            if lsmod | grep -q "^$m "; then sudo rmmod $m; fi
          done
          rdma link show
          cargo llvm-cov --no-report run --example ibv_devinfo
          just test-basic-with-cov
          just test-rc-pingpong-with-cov
          just test-cmtime-with-cov
          just generate-cov
      - name: Upload coverage information
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          file: lcov.info
